[project]
name = "recursive-xy-cut"
version = "0.1.0"
description = "Python implementation of the recursive XY cut algorithm for reading-order detection in document layouts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Mihail Yanchev", email = "yanchev.mihail@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["document-layout", "reading-order", "xy-cut", "document-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
]

[project.urls]
Repository = "https://github.com/mihailyanchev/recursive_xy_cut"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific rules
    "PT",       # flake8-pytest-style
    "NPY",      # numpy-specific rules
]
ignore = [
    "D105",  # magic methods don't need docstrings
    "D107",  # __init__ is documented by the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# ---------------------------------------------------------------------------
# Pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.coverage.run]
source = ["recursive_xy_cut"]
branch = true

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
